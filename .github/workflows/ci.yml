name: C17 compiler contracts
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.compiler }} CFLAGS='-std=c17 -O2 -Wall -Wextra -Wpedantic -Werror' test
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make sanitize
